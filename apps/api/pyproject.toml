[project]
name = "api"
version = "0.1.0"
description = "myapp API (FastAPI)"
readme = "README.md"
authors = [
    { name = "Gokhulnath Thirumaran", email = "gokhulnath.thirumaran@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asgi-correlation-id>=5.0.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]==0.162.0",
    "fastmcp>=4.1.3",
    "pydantic-settings>=2.16.1",
    "scalar-fastapi>=1.9.1",
    "sqlalchemy[asyncio]>=2.1.6",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7",
    "ruff>=0.17.2",
]

[tool.fastapi]
entrypoint = "api.main:app"

[tool.pytest.ini_options]
# Every run measures coverage, so pruning tests can't quietly drop what they protect
# (CLAUDE.md, "Tests").
addopts = ["--cov", "--cov-report=term-missing:skip-covered"]

[tool.coverage.run]
source = ["api"]
branch = true

[tool.coverage.report]
# Just under today's number. Raise it as coverage rises; never lower it to make a change
# pass.
fail_under = 99

[tool.uv]
required-version = ">=0.12"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "standard"
# tests/support.py is imported as `support` (see [tool.pytest.ini_options]).
extraPaths = ["tests"]
