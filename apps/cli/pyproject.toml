[project]
name = "myapp"
version = "0.1.0"
description = "myapp from the terminal: commands, a terminal UI and an MCP server"
readme = "README.md"
authors = [
    { name = "Gokhulnath Thirumaran", email = "gokhulnath.thirumaran@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.1.3",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "textual>=8.2.8",
    "typer>=0.27.3",
]

[project.scripts]
myapp = "myapp.cli:app"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
# Every run measures coverage, so pruning tests can't quietly drop what they protect
# (CLAUDE.md, "Tests").
addopts = ["--cov", "--cov-report=term-missing:skip-covered"]

[tool.coverage.run]
source = ["myapp"]
branch = true

[tool.coverage.report]
# Just under today's number. Raise it as coverage rises; never lower it to make a change
# pass.
fail_under = 94

[tool.uv]
required-version = ">=0.12"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "standard"
